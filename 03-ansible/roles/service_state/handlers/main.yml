---
- name: Restart nginx with systemd
  ansible.builtin.systemd:
    name: nginx
    state: restarted
  listen: Restart nginx
  when: ansible_service_mgr == "systemd"

- name: Restart nginx without systemd
  ansible.builtin.shell: |
    nginx -t || exit 1
    if [ -f /run/nginx.pid ]; then
      nginx -s quit
      i=0
      while [ -f /run/nginx.pid ] && [ "$i" -lt 30 ]; do
        sleep 1
        i=$((i + 1))
      done
      [ ! -f /run/nginx.pid ] || exit 1
    fi
    nginx
  listen: Restart nginx
  when: ansible_service_mgr != "systemd"
