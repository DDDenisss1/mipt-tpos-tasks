---
- name: Remove default nginx site on Ubuntu
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: ansible_os_family == "Debian"
  notify: Restart nginx

- name: Remove default nginx configuration on CentOS
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  when: ansible_os_family == "RedHat"
  notify: Restart nginx

- name: Configure nginx service endpoint
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/service_state.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx

- name: Check nginx process
  ansible.builtin.command: pgrep -x nginx
  register: nginx_process
  changed_when: false
  failed_when: false

- name: Start nginx if not running
  ansible.builtin.command: nginx
  when:
    - ansible_service_mgr != "systemd"
    - nginx_process.rc != 0
