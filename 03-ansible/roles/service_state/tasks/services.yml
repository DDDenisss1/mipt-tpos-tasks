---
- name: Enable and start nginx with systemd
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  when: ansible_service_mgr == "systemd"

- name: Enable and start cron with systemd
  ansible.builtin.systemd:
    name: "{{ 'cron' if ansible_os_family == 'Debian' else 'crond' }}"
    enabled: true
    state: started
  when: ansible_service_mgr == "systemd"
