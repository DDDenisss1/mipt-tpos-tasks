---
- name: Install uptime update script
  ansible.builtin.copy:
    src: update_nginx_uptime.sh
    dest: /usr/local/bin/update_nginx_uptime.sh
    owner: root
    group: root
    mode: '0755'

- name: Configure uptime cron job
  ansible.builtin.cron:
    name: Update nginx uptime
    minute: "*"
    user: root
    job: /usr/local/bin/update_nginx_uptime.sh

- name: Check cron process
  ansible.builtin.shell: pgrep -x cron || pgrep -x crond
  register: cron_process
  changed_when: false
  failed_when: false

- name: Start cron on Ubuntu if not running
  ansible.builtin.command: cron
  when:
    - ansible_os_family == "Debian"
    - ansible_service_mgr != "systemd"
    - cron_process.rc != 0

- name: Start crond on CentOS if not running
  ansible.builtin.command: crond
  when:
    - ansible_os_family == "RedHat"
    - ansible_service_mgr != "systemd"
    - cron_process.rc != 0
